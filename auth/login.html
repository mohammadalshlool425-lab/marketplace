<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تسجيل الدخول إلى منصة السوق - بيع وشراء بكل سهولة">
    <title>تسجيل الدخول | السوق</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <!-- ============ Loading Spinner ============ -->
    <div class="spinner-overlay" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <!-- ============ Toast Container ============ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============ Login Page ============ -->
    <main class="auth-page">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">🏪</div>
                <h1>مرحباً بعودتك</h1>
                <p>سجّل دخولك للوصول إلى حسابك</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">
                        البريد الإلكتروني
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                            dir="ltr"
                        >
                        <span class="input-icon">📧</span>
                    </div>
                    <div class="field-error" id="emailError">
                        <span>⚠️</span>
                        <span class="error-text">يرجى إدخال بريد إلكتروني صحيح</span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">
                        كلمة المرور
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                            minlength="6"
                        >
                        <span class="input-icon">🔒</span>
                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="إظهار كلمة المرور"
                        >👁️</button>
                    </div>
                    <div class="field-error" id="passwordError">
                        <span>⚠️</span>
                        <span class="error-text">كلمة المرور يجب أن تكون 6 أحرف على الأقل</span>
                    </div>
                </div>

                <!-- Options Row -->
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <span>تذكرني</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-auth btn-primary" id="loginBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider" style="margin: 24px 0;">
                أو
            </div>

            <!-- Social Login -->
            <div class="social-buttons">
                <button type="button" class="btn-social" id="googleLoginBtn">
                    <span>🔵</span>
                    <span>Google</span>
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>
                    ليس لديك حساب؟
                    <a href="register.html">إنشاء حساب جديد</a>
                </p>
            </div>
        </div>
    </main>

    <!-- ============ Firebase SDK ============ -->
    <!-- النسخة 9 متوافقة مع CDN (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
